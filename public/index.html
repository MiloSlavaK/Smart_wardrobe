<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script>
      (function() {
        function isSdkNoise(msg) {
          return typeof msg === 'string' && msg.indexOf('applicationId') !== -1;
        }
        window.addEventListener('error', function(e) {
          var msg = (e.message || '') + ((e.error && e.error.message) || '');
          if (isSdkNoise(msg)) { e.stopImmediatePropagation(); e.preventDefault(); }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && e.reason.message) || String(e.reason || '');
          if (isSdkNoise(msg)) { e.stopImmediatePropagation(); e.preventDefault(); }
        }, true);
      })();
    </script>
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="SmartApp помощник по складыванию одежды - научитесь складывать вещи как в магазине!"
    />
    <title>🗂️ Помощник по складыванию одежды</title>
  </head>
  <body>
    <noscript>Вам нужно включить JavaScript для работы этого приложения.</noscript>
    <div id="root"></div>
  </body>
</html>
